name: Meta Ad Tracker Spy Worker

on:
  schedule:
    # 2 rounds per day: Midday (12:00 PM UTC+1 / 11:00 UTC) & Midnight (00:00 AM UTC+1 / 23:00 UTC)
    - cron: '0 11,23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

# Global concurrency group to guarantee zero job overlap across workflows
concurrency:
  group: meta-ad-worker-group
  cancel-in-progress: false

jobs:
  run-spy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Playwright Chromium Browser
        run: npx playwright install chromium --with-deps
        continue-on-error: false

      - name: Run Background Ad Spy Worker Queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SINGLE_RUN: "true"
          PLAYWRIGHT_HEADLESS: "true"
          ENQUEUE_SPY: "true"
          AUTO_BURST_ENQUEUE: "false"
          SPY_COOLDOWN_DAYS: "3"
          SPY_MAX_PAGES_PER_RUN: "50"
          MAX_SCANS_PER_HOUR: "100"
          MAX_SCANS_PER_DAY: "0"
        run: npm run worker -- --enqueue-spy
