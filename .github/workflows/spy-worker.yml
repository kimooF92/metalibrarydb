name: Meta Ad Tracker Spy Worker

on:
  schedule:
    # Run once per day in afternoon window (2:00 PM UTC+1 / 13:00 UTC) with zero overlap against count workers
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-spy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Playwright Chromium Browser
        run: npx playwright install chromium --with-deps
        continue-on-error: false

      - name: Run Background Ad Spy Worker Queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SINGLE_RUN: "true"
          PLAYWRIGHT_HEADLESS: "true"
          ENQUEUE_SPY: "true"
          MAX_SCANS_PER_HOUR: "100"
          MAX_SCANS_PER_DAY: "0"
        run: npm run worker -- --enqueue-spy
