name: Meta Ad Tracker Apify Spy Worker

on:
  schedule:
    # 2 rounds per day: Midday (12:30 PM UTC+1 / 11:30 UTC) & Midnight (00:30 AM UTC+1 / 23:30 UTC)
    - cron: '30 11,23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime with optional inputs
    inputs:
      max_pages:
        description: 'Maximum Pages to Scan (default: 25)'
        required: false
        default: '25'
      force_all:
        description: 'Force all active pages regardless of +1 diff (true/false)'
        required: false
        default: 'false'
      page_id:
        description: 'Target specific Tracked Page UUID (optional)'
        required: false
        default: ''

# Dedicated concurrency group with cancel-in-progress to avoid blocking count workers
concurrency:
  group: meta-ad-spy-worker-group
  cancel-in-progress: true

jobs:
  run-apify-spy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Apify Ad Spy Cloud Extraction
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}
          APIFY_API_TOKEN_1: ${{ secrets.APIFY_API_TOKEN_1 }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          APIFY_API_TOKEN_3: ${{ secrets.APIFY_API_TOKEN_3 }}
          APIFY_API_TOKEN_4: ${{ secrets.APIFY_API_TOKEN_4 }}
          APIFY_API_TOKEN_5: ${{ secrets.APIFY_API_TOKEN_5 }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # Backblaze B2 Media Storage (optional)
          B2_KEY_ID: ${{ secrets.B2_KEY_ID || secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_DOWNLOAD_URL: ${{ secrets.B2_DOWNLOAD_URL }}
          # Run parameters
          SPY_MAX_PAGES_PER_RUN: ${{ inputs.max_pages || '25' }}
          SPY_FORCE_ALL: ${{ inputs.force_all || 'false' }}
        run: |
          if [ -n "${{ inputs.page_id }}" ]; then
            echo "Running targeted Apify scan for page ID: ${{ inputs.page_id }}"
            npx tsx scripts/run-apify-spy-cron.ts --page-id "${{ inputs.page_id }}"
          else
            echo "Running batch Apify scan for eligible pages..."
            npm run spy:apify
          fi

      - name: Scrape New Product Landing Pages (Follow-up)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPE_LIMIT: 100
          SCRAPE_STATUS: 'pending'
        run: |
          echo "Processing any pending extracted product pages..."
          npx tsx scripts/run-product-scraper.ts --limit 100 --status pending || true

