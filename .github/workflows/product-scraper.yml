name: Product Pages Direct Scraper

on:
  schedule:
    # Runs twice daily: 05:00 UTC (06:00 AM Tunisia/UTC+1) and 17:00 UTC (18:00 PM Tunisia/UTC+1)
    - cron: '0 5,17 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI anytime
    inputs:
      limit:
        description: 'Maximum Products to Scrape (default: 100)'
        required: false
        default: '100'
      force_all:
        description: 'Re-scrape all products regardless of status (true/false)'
        required: false
        default: 'false'
      status_filter:
        description: 'Status filter (pending, failed, all)'
        required: false
        default: 'pending'
      page:
        description: 'Target specific Brand Page ID or Name (optional)'
        required: false
        default: ''
      url:
        description: 'Target a single Product URL (optional)'
        required: false
        default: ''

concurrency:
  group: product-scraper-group
  cancel-in-progress: false

jobs:
  run-product-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Run Direct Product Scraper Batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCRAPE_LIMIT: ${{ inputs.limit || '100' }}
          SCRAPE_FORCE_ALL: ${{ inputs.force_all || 'false' }}
          SCRAPE_STATUS: ${{ inputs.status_filter || 'pending' }}
          SCRAPE_PAGE: ${{ inputs.page || '' }}
          SCRAPE_URL: ${{ inputs.url || '' }}
        run: |
          FLAGS="--limit ${SCRAPE_LIMIT}"
          if [ -n "${SCRAPE_URL}" ]; then
            FLAGS="--url \"${SCRAPE_URL}\""
          elif [ -n "${SCRAPE_PAGE}" ]; then
            FLAGS="--page \"${SCRAPE_PAGE}\""
          elif [ "${SCRAPE_FORCE_ALL}" = "true" ]; then
            FLAGS="$FLAGS --force-all"
          elif [ -n "${SCRAPE_STATUS}" ] && [ "${SCRAPE_STATUS}" != "all" ]; then
            FLAGS="$FLAGS --status ${SCRAPE_STATUS}"
          fi
          echo "Executing product scraper with flags: $FLAGS"
          npx tsx scripts/run-product-scraper.ts $FLAGS

      - name: Reclassify General Merchandise with TypeSafe Jev
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Running Jev classification for active General Merchandise products..."
          npx tsx scripts/classify-active-products-jev.ts --concurrency 5

      - name: Resolve 0 DT Prices with TypeSafe Jev Referee
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Running Jev price referee for active 0 DT products..."
          npx tsx scripts/resolve-zero-prices-jev.ts --concurrency 4

