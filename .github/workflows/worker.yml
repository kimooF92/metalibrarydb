name: Meta Ad Tracker Worker

on:
  schedule:
    # Run every day at 10:00 AM UTC+1 (09:00 UTC) and 9:00 PM UTC+1 (20:00 UTC)
    - cron: '0 9,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-worker:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Playwright Chromium Browser
        run: npx playwright install chromium

      - name: Run Background Worker Queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SINGLE_RUN: "true"
          REFRESH_ALL: "true"
          PLAYWRIGHT_HEADLESS: "true"
        run: npm run worker
