name: Meta Ad Tracker Worker

on:
  schedule:
    # 2 Burst Windows of 3 Rounds: Morning (9:00-11:00 AM UTC+1 / 8:00-10:00 UTC) & Night (9:00-11:00 PM UTC+1 / 20:00-22:00 UTC)
    - cron: '0 8,9,10,20,21,22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

# Global concurrency group to guarantee zero job overlap across workflows
concurrency:
  group: meta-ad-worker-group
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Playwright Chromium Browser
        run: npx playwright install chromium --with-deps
        continue-on-error: false

      - name: Run Background Worker Queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SINGLE_RUN: "true"
          PLAYWRIGHT_HEADLESS: "true"
          MAX_SCANS_PER_HOUR: "100"
          MAX_SCANS_PER_DAY: "0"
        run: npm run worker
