name: Meta Ad Tracker Worker

on:
  workflow_dispatch: # Triggered via external cron or manual trigger
    inputs:
      run_canary:
        description: 'Run Meta Ad Library Canary check on startup (true/false)'
        required: false
        default: 'false'
      force_refresh:
        description: 'Force all active pages regardless of cooldown (true/false)'
        required: false
        default: 'false'
      cooldown_hours:
        description: 'Cooldown threshold in hours (default: 11)'
        required: false
        default: '11'

# Dedicated concurrency group with cancel-in-progress to prevent stalled runs from blocking the queue
concurrency:
  group: meta-ad-count-worker-group
  cancel-in-progress: true

jobs:
  # STAGE 1: Ultra-fast Enqueue & Stuck Scans Cleaner (No Playwright, finishes in ~15-20s)
  enqueue-jobs:
    name: Enqueue Stale Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_jobs: ${{ steps.enqueue.outputs.has_jobs }}
      job_count: ${{ steps.enqueue.outputs.job_count }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Run Enqueue & Clean Stuck Jobs
        id: enqueue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AUTO_REFRESH_COOLDOWN_HOURS: ${{ inputs.cooldown_hours || '11' }}
          REFRESH_ALL: ${{ inputs.force_refresh || 'false' }}
        run: npm run enqueue:refresh

  # STAGE 2: 4-Shard Browser Worker Matrix (Only runs if has_jobs == 'true')
  run-worker-matrix:
    name: Shard ${{ matrix.shard_num }}/4
    needs: enqueue-jobs
    if: needs.enqueue-jobs.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001 --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30

    strategy:
      fail-fast: false # Keeps other shards running even if one encounters a transient error
      matrix:
        include:
          - shard: 0
            shard_num: 1
          - shard: 1
            shard_num: 2
          - shard: 2
            shard_num: 3
          - shard: 3
            shard_num: 4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Ensure Playwright Chromium Binary Matches Lockfile
        run: |
          if ! node -e "const fs=require('fs'), {chromium}=require('playwright'); process.exit(fs.existsSync(chromium.executablePath()) ? 0 : 1)"; then
            echo "Container Chromium mismatch; downloading matching browser binary..."
            npx playwright install chromium
          fi

      - name: Run Background Worker Shard ${{ matrix.shard_num }}/4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || vars.NEXT_PUBLIC_APP_URL || 'https://metalibrarydb.vercel.app' }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}
          APIFY_API_TOKEN_1: ${{ secrets.APIFY_API_TOKEN_1 }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          APIFY_API_TOKEN_3: ${{ secrets.APIFY_API_TOKEN_3 }}
          APIFY_API_TOKEN_4: ${{ secrets.APIFY_API_TOKEN_4 }}
          APIFY_API_TOKEN_5: ${{ secrets.APIFY_API_TOKEN_5 }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID || secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_DOWNLOAD_URL: ${{ secrets.B2_DOWNLOAD_URL }}
          SINGLE_RUN: "true"
          PLAYWRIGHT_HEADLESS: "true"
          MAX_SCANS_PER_HOUR: "0"
          MAX_SCANS_PER_DAY: "0"
          AUTO_REFRESH_COOLDOWN_HOURS: ${{ inputs.cooldown_hours || '11' }}
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 4
          COUNT_ONLY: "true"
          AUTO_ENQUEUE_SPY: "false"
          SKIP_STARTUP_SWEEP: "true"
          SKIP_ENQUEUE: "true"
          RUN_CANARY_CHECK: ${{ inputs.run_canary || 'false' }}
          ZERO_AD_ANOMALY_THRESHOLD: "3"
          ZERO_AD_ANOMALY_WINDOW_MINUTES: "20"
          CIRCUIT_BREAKER_COOLDOWN_MINUTES: "45"
        run: npm run worker
