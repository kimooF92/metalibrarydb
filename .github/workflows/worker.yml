name: Meta Ad Tracker Worker

on:
  workflow_dispatch: # Triggered exclusively via external cron (cron-job.org) or manual UI trigger

# Dedicated concurrency group with cancel-in-progress to prevent stalled runs from blocking the queue
concurrency:
  group: meta-ad-count-worker-group
  cancel-in-progress: true

jobs:
  run-worker-matrix:
    name: Shard ${{ matrix.shard_num }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false # Keeps other shards running even if one encounters a transient error
      matrix:
        include:
          - shard: 0
            shard_num: 1
          - shard: 1
            shard_num: 2
          - shard: 2
            shard_num: 3
          - shard: 3
            shard_num: 4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Playwright Chromium Browser
        run: npx playwright install chromium --with-deps
        continue-on-error: false

      - name: Run Background Worker Shard ${{ matrix.shard_num }}/4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          SINGLE_RUN: "true"
          PLAYWRIGHT_HEADLESS: "true"
          MAX_SCANS_PER_HOUR: "0"
          MAX_SCANS_PER_DAY: "0"
          AUTO_REFRESH_COOLDOWN_HOURS: "11"
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 4
        run: npm run worker
