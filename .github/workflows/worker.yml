name: Meta Ad Tracker Worker

on:
  schedule:
    # Run every hour (24 times per day)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-worker:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Playwright Chromium Browser
        run: npx playwright install chromium

      - name: Run Background Worker Queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SINGLE_RUN: "true"
          REFRESH_ALL: "true"
          PLAYWRIGHT_HEADLESS: "true"
          MAX_SCANS_PER_HOUR: "100"
          MAX_SCANS_PER_DAY: "0"
        run: npm run worker
