name: Meta Ad Tracker Worker

on:
  schedule:
    # Runs every 2 hours (00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

# Global concurrency group to guarantee zero job overlap across workflows
concurrency:
  group: meta-ad-worker-group
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Playwright Chromium Browser
        run: npx playwright install chromium --with-deps
        continue-on-error: false

      - name: Run Background Worker Queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SINGLE_RUN: "true"
          PLAYWRIGHT_HEADLESS: "true"
          MAX_SCANS_PER_HOUR: "0"
          MAX_SCANS_PER_DAY: "0"
          AUTO_REFRESH_COOLDOWN_HOURS: "12"
        run: npm run worker
