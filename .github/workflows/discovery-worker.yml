name: Meta Ad Tracker Discovery Worker

on:
  schedule:
    # Run twice per day (00:00 & 12:00 UTC) to process queued country discovery scans
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      country:
        description: 'Target Country Code (e.g. TN, FR, US, AE, SA, MA, DZ, EG)'
        required: false
        default: 'TN'
      query:
        description: 'Search Query Text (optional)'
        required: false
        default: ''
      max_ads:
        description: 'Maximum Ads Capacity to Scan'
        required: false
        default: '2500'

# Global concurrency group to guarantee zero job overlap across workflows
concurrency:
  group: meta-ad-worker-group
  cancel-in-progress: false

jobs:
  run-discovery-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Ensure Playwright Chromium Browser
        run: npx playwright install chromium --with-deps
        continue-on-error: false

      - name: Run Background Discovery Worker Queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SINGLE_RUN: "true"
          PLAYWRIGHT_HEADLESS: "true"
          AUTO_BURST_ENQUEUE: "false"
          DISCOVERY_MAX_ADS: ${{ inputs.max_ads || '2500' }}
          TARGET_COUNTRY: ${{ inputs.country || 'TN' }}
        run: |
          if [ -n "${{ inputs.country }}" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running direct discovery scan for country ${{ inputs.country }}..."
            npm run worker -- --discovery-url "https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=${{ inputs.country }}&is_targeted_country=false&media_type=video&publisher_platforms[0]=facebook&publisher_platforms[1]=instagram&q=${{ inputs.query || '%E2%80%8D' }}&search_type=keyword_unordered&sort_data[mode]=relevancy_monthly_grouped&sort_data[direction]=desc"
          else
            echo "Processing pending discovery scan jobs from database..."
            npm run worker
          fi
