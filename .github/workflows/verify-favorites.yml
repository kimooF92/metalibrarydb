name: Verify Favorite Products Ads

on:
  schedule:
    # Runs daily at 03:00 UTC (04:00 AM Tunisia/UTC+1) - Nightly quiet window
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI anytime
    inputs:
      force:
        description: 'Force recheck ALL ads (including inactive/archived to restore them)'
        type: boolean
        required: false
        default: true
      limit:
        description: 'Maximum products to check per run (leave empty for all favorites)'
        required: false
        default: ''

# Dedicated concurrency group: prevents duplicate runs from stomping over each other
concurrency:
  group: verify-favorite-ads-group
  cancel-in-progress: true

jobs:
  verify-favorites-matrix:
    name: Shard ${{ matrix.shard_num }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false # Keeps other shards running even if one encounters a transient error
      matrix:
        include:
          - shard: 0
            shard_num: 1
          - shard: 1
            shard_num: 2
          - shard: 2
            shard_num: 3
          - shard: 3
            shard_num: 4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Configure APT Mirror & Network Timeouts
        run: |
          FILES=$(sudo grep -Irl "azure\.archive\.ubuntu\.com" /etc/apt || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs -r sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
          fi
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network > /dev/null

      - name: Install Playwright OS Dependencies
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying Playwright OS dependency installation (attempt $((attempt + 1))/3)..."
              sudo dpkg --configure -a || true
              sleep 5
            fi
          done
          exit 1

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Shard ${{ matrix.shard_num }}/4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PLAYWRIGHT_HEADLESS: "true"
        run: |
          FLAGS="--shard ${{ matrix.shard }}/4"

          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi

          if [ -n "${{ inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ inputs.limit }}"
          fi

          echo "Running favorite ads verifier shard [${{ matrix.shard_num }}/4] with flags: $FLAGS"
          npx tsx scripts/verify-favorite-ads.ts $FLAGS
